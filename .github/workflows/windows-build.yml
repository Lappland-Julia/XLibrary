name: Windows Build

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.8.3'

jobs:
  windows-build:
    name: windows-${{ matrix.compiler }}-${{ matrix.configuration }}
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: msvc
            configuration: Release
            qt_arch: win64_msvc2022_64
            tools: ''
          - compiler: msvc
            configuration: Debug
            qt_arch: win64_msvc2022_64
            tools: ''
          - compiler: mingw
            configuration: Release
            qt_arch: win64_mingw
            tools: tools_mingw1310,qt.tools.win64_mingw1310

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up MSVC
        if: matrix.compiler == 'msvc'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt_arch }}
          tools: ${{ matrix.tools }}
          cache: true

      - name: Configure
        env:
          BUILD_CONFIGURATION: ${{ matrix.configuration }}
          BUILD_COMPILER: ${{ matrix.compiler }}
        run: |
          $arguments = @('-S', '.', '-B', 'build', '-DXLIBRARY_NATIVE_CPU=OFF')
          if ($env:BUILD_COMPILER -eq 'msvc') {
            $arguments += @('-G', 'Visual Studio 17 2022', '-A', 'x64')
          } else {
            $toolchain = Join-Path $env:IQTA_TOOLS 'mingw1310_64/bin'
            $arguments += @('-G', 'Ninja', "-DCMAKE_BUILD_TYPE=$env:BUILD_CONFIGURATION",
              "-DCMAKE_C_COMPILER=$toolchain/gcc.exe", "-DCMAKE_CXX_COMPILER=$toolchain/g++.exe")
          }
          cmake @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        env:
          BUILD_CONFIGURATION: ${{ matrix.configuration }}
        run: |
          cmake --build build --config $env:BUILD_CONFIGURATION --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ matrix.compiler }}-${{ matrix.configuration }}-${{ github.run_attempt }}
          path: |
            build/CMakeCache.txt
            build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 7
