name: Windows Build

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-release-build:
    name: windows-release-build
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Required only by branches containing the Qt desktop interface.
      - name: Install Qt
        if: ${{ hashFiles('desktop/**/*.cpp') != '' }}
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Configure Release
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DXLIBRARY_NATIVE_CPU=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Release
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package application
        shell: pwsh
        run: |
          if (Test-Path 'desktop') {
            cmake --install build --config Release --prefix "$env:GITHUB_WORKSPACE\dist"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            New-Item -ItemType Directory -Force -Path dist | Out-Null
            Copy-Item 'build/Release/XLibrary.exe' -Destination dist -ErrorAction Stop
          }

          if (-not (Test-Path 'dist/XLibrary.exe')) {
            throw 'XLibrary.exe was not found in the deployment directory.'
          }

      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: XLibrary-windows-x64-release
          path: dist/
          if-no-files-found: error
          retention-days: 14
