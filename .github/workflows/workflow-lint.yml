name: Workflow Lint

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check workflows
        shell: bash
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - name: Check packaging Python syntax
        run: python3 -m compileall -q packaging

      - name: Validate CMake presets
        run: cmake --list-presets=all

      - name: Validate JSON configuration
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          files = subprocess.check_output(["git", "ls-files", "-z", "--", "*.json"]).decode().split("\0")
          for name in filter(None, files):
              json.loads(Path(name).read_text(encoding="utf-8"))
              print(f"Valid JSON: {name}")
          PY
